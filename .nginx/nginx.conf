worker_processes 1;
error_log NGINX_DIR/error.log warn;
pid NGINX_DIR/nginx.pid;

events {
    worker_connections 64;
}

http {
    include MIME_TYPES_PATH;
    default_type application/octet-stream;
    access_log NGINX_DIR/access.log;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # HTTPS server (required for WebXR on Vision Pro Safari)
    server {
        listen 8443 ssl;
        server_name localhost;

        ssl_certificate     NGINX_DIR/cert.pem;
        ssl_certificate_key NGINX_DIR/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        root PROJECT_ROOT;
        index index.html;

        # Static files
        location / {
            try_files $uri $uri/ /index.html;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }

        # API proxy to Node.js server
        location /api/ {
            proxy_pass http://127.0.0.1:7778/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            add_header Access-Control-Allow-Origin *;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://127.0.0.1:7778;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    # HTTP server (for testing without SSL warnings)
    server {
        listen 8080;
        server_name localhost;

        root PROJECT_ROOT;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }

        location /api/ {
            proxy_pass http://127.0.0.1:7778/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            add_header Access-Control-Allow-Origin *;
        }

        location /ws {
            proxy_pass http://127.0.0.1:7778;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
